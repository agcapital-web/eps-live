name: Refresh EPS screen
on:
  schedule:
    # Every 15 min, 07:30-23:59 IST (02:00-18:29 UTC), Mon-Sat. GitHub may run late under load.
    - cron: "*/15 2-18 * * 1-6"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch new filings and update the screen
        run: python run_refresh.py
      - name: Commit if anything changed
        run: |
          git config user.name "eps-screen-bot"
          git config user.email "eps-screen-bot@users.noreply.github.com"
          git add docs/screen.json state.json
          git diff --cached --quiet || (git commit -m "Refresh EPS screen $(date -u +%FT%TZ)" && git push)
