name: Diagnose data sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python diag.py
      - run: |
          git config user.name "eps-screen-bot"
          git config user.email "eps-screen-bot@users.noreply.github.com"
          git add diag.txt && git commit -m "Source diagnostics" && git pull --rebase && git push
