name: Full scan (backfill)
on:
  workflow_dispatch:
    inputs:
      quarter:
        description: "Quarter to look for, as Screener labels it"
        required: false
        default: "Sep 2026"
permissions:
  contents: write
concurrency:
  group: refresh          # never runs at the same time as the 15-minute refresh
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Screen every NSE company on Screener
        run: python full_scan.py
        env:
          QUARTER: ${{ github.event.inputs.quarter }}
      - name: Commit results
        run: |
          git config user.name "eps-screen-bot"
          git config user.email "eps-screen-bot@users.noreply.github.com"
          git add docs/screen.json
          git diff --cached --quiet || (git commit -m "Full scan $(date -u +%FT%TZ)" && git pull --rebase && git push)
